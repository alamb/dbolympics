# GizmoSQL: DuckDB behind an Arrow Flight SQL server, installed in the system's own container.
# Dialect as for DuckDB (../duckdb).
name = "gizmosql"
# the version, kept with the results (by hand)
version = "v1.42.0 (DuckDB 1.5.6)"


[load]
statement = "COPY {table} FROM '{file}' (FORMAT parquet)"

[dialect]
# DuckDB's threads and memory limit for the run (80% of the limit for its buffers, as DuckDB's
# own default); exact division of integers gives an exact (integer) result, as the standard
# requires (DuckDB's default is a double)
settings = ["SET threads = {threads}", "SET memory_limit = '{memory_mb%80}MiB'", "SET integer_division = true"]

[dialect.functions]
"date_diff_days(a, b)" = "DATE_DIFF('day', {a}, {b})"
"year_month(x)" = "strftime({x}, '%Y-%m')"
