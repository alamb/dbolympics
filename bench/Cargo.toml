[package]
name = "dbo-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "dbolympics benchmark runner"
license = "MIT"
publish = false

[[bin]]
name = "dbo-bench"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
libc = "0.2"
num-bigint = "0.4"
num-integer = "0.1"
parquet = { version = "58", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
