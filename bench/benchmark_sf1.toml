# The benchmark at scale factor 1 (about 1 GB of CSV, 0.2 GB of Parquet), on 4 instance shapes of
# the AWS c8a family (2 GiB per vCPU, one physical core per vCPU). See docs/RUNNER.md for the
# fields and the procedure. Every system of systems/.
repetitions   = 1
query_timeout = 5               # seconds per query
grace_period  = 5               # seconds past the timeout before a run fails as stuck
load_timeout  = 300             # seconds per load, its statements together
keys          = "none"

[[config]]
name          = "sf1-c8a.medium"
sf            = 1
threads       = 1
memory        = "2GB"

[[config]]
name          = "sf1-c8a.large"
sf            = 1
threads       = 2
memory        = "4GB"

[[config]]
name          = "sf1-c8a.xlarge"
sf            = 1
threads       = 4
memory        = "8GB"

[[config]]
name          = "sf1-c8a.2xlarge"
sf            = 1
threads       = 8
memory        = "16GB"
